services:
  - type: web
    name: nahavideo-ai-director
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: NAHAVIDEO_ENABLE_TRANSCRIBE
        value: "0"
      - key: NAHAVIDEO_ENABLE_VISION
        value: "0"
