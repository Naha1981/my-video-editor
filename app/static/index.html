<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NahaVideo AI Director</title>
<style>:root{--bg:#0b0d0f;--panel:#12161a;--line:#252b31;--text:#f3f4f6;--muted:#9ca3af;--accent:#d9ff4f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.brand{font-weight:800;font-size:22px}.tag{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.wide{grid-column:1/-1}textarea,input{width:100%;background:#0d1115;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px;font:inherit}textarea{min-height:130px;resize:vertical}button{background:var(--accent);color:#101300;border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer;margin-top:12px}button:disabled{opacity:.5}.clips{display:grid;gap:8px;margin-top:12px}.clip{padding:11px;border:1px solid var(--line);border-radius:9px}.clipTop{display:flex;justify-content:space-between;gap:12px}.badge{font-size:11px;border:1px solid #3b4650;padding:2px 7px;border-radius:999px;color:var(--muted)}.muted,.status{color:var(--muted)}.rank{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.score{font-weight:800;color:var(--accent);min-width:45px}.timeline{display:flex;gap:6px;min-height:110px;align-items:stretch;overflow:auto}.seg{background:#252c33;border-radius:8px;padding:10px;font-size:12px;min-width:120px}.seg b{display:block;margin-bottom:5px}.logo{background:#353d46}.metric{font-size:12px;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head>
<body><main><div class="top"><div><div class="brand">NAHAVIDEO / AI DIRECTOR</div><div class="tag">Local-first creative editing engine</div></div><div class="muted">v0.2</div></div>
<div class="grid"><section class="panel"><h2>1. Footage</h2><input id="files" type="file" accept="video/*" multiple><button onclick="upload()">Analyse footage</button><div id="clips" class="clips"></div></section>
<section class="panel"><h2>2. Creative brief</h2><textarea id="prompt">Create a 30-second premium restaurant advertisement. Start with the strongest food shot, remove dead time, keep the pacing energetic, lower the music under dialogue, and finish with the NahaLabs logo.</textarea><label class="metric">Optional background music</label><input id="music" type="file" accept="audio/*"><button id="planBtn" onclick="makePlan()" disabled>Build edit plan</button><div id="status" class="status"></div></section>
<section class="panel wide"><h2>3. Director decision</h2><div id="ranked" class="muted">Upload footage to begin.</div></section>
<section class="panel wide"><h2>4. Timeline</h2><div id="timeline" class="timeline"></div><button id="renderBtn" onclick="renderVideo()" disabled>Render MP4 with FFmpeg</button><div id="result" class="status"></div></section></div></main>
<script>let clips=[],plan=null,musicId=null;const $=id=>document.getElementById(id);const fmt=s=>s.toFixed(1)+'s';
async function upload(){const fs=[...$('files').files];if(!fs.length)return;$('status').textContent='Uploading, probing frames and analysing audio…';const fd=new FormData();fs.forEach(f=>fd.append('files',f));const r=await fetch('/api/upload',{method:'POST',body:fd});const data=await r.json();if(!r.ok){$('status').textContent=data.detail||JSON.stringify(data);return}clips=data;$('clips').innerHTML=clips.map(c=>{const a=c.analysis||{};return '<div class="clip"><div class="clipTop"><b>'+c.filename+'</b><span class="badge">visual '+Math.round(a.visual_score||50)+'/100</span></div><div class="muted">'+fmt(c.duration)+' · '+c.width+'×'+c.height+' · '+(a.scenes||1)+' scenes · '+((a.audio?.silence_ratio*100)||0).toFixed(0)+'% audio silence</div></div>'}).join('');$('planBtn').disabled=false;$('status').textContent=clips.length+' clip(s) ready.'}
async function uploadMusic(){const file=$('music').files[0];if(!file)return null;const fd=new FormData();fd.append('file',file);const r=await fetch('/api/upload-music',{method:'POST',body:fd});const data=await r.json();if(!r.ok){$('status').textContent=data.detail||'Music upload failed';return null}return data.id}
async function makePlan(){if(!clips.length)return;$('status').textContent='Director is building the edit decision graph…';musicId=await uploadMusic();const r=await fetch('/api/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:$('prompt').value,duration:30,clip_ids:clips.map(c=>c.id),music_id:musicId})});plan=await r.json();if(!r.ok){$('status').textContent=plan.detail||JSON.stringify(plan);return}renderPlan();$('status').textContent='Plan ready · '+plan.timeline.length+' elements · real frame/audio analysis';$('renderBtn').disabled=false}
function renderPlan(){$('ranked').innerHTML=plan.shots_ranked.map((x,i)=>'<div class="rank"><div class="score">'+x.score+'</div><div><b>'+(i+1)+'. '+x.filename+'</b><div class="muted">'+x.reasons.join(' · ')+'</div></div></div>').join('');$('timeline').innerHTML=plan.timeline.map((x,i)=>x.type==='logo'?'<div class="seg logo"><b>NAHALABS END CARD</b>'+x.duration+'s</div>':'<div class="seg"><b>'+(i+1)+'. '+x.filename+'</b>'+x.duration+'s · start '+x.source_start+'s</div>').join('')}
async function renderVideo(){if(!plan)return;$('result').textContent='Rendering…';const r=await fetch('/api/render',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan,clip_ids:clips.map(c=>c.id),music_id:musicId})});const data=await r.json();if(!r.ok){$('result').textContent=data.detail||JSON.stringify(data);return}$('result').innerHTML='Render complete: <a style="color:#d9ff4f" href="'+data.download+'">download MP4</a>'}</script></body></html>
